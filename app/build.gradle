apply plugin: 'com.android.application'
apply plugin: 'checkstyle'
apply plugin: 'pmd'

android {
    compileSdkVersion 23
    buildToolsVersion '23.0.2'

    defaultConfig {
        applicationId "com.example.mythi_000.cricket"
        minSdkVersion 17
        targetSdkVersion 23
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }


        packagingOptions {
            exclude 'META-INF/LICENSE'
            exclude 'META-INF/DEPENDENCIES'
            exclude 'META-INF/NOTICE'
        }

}

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    testCompile 'junit:junit:4.12'
    compile 'com.android.support:appcompat-v7:23.1.0'
    compile 'com.android.support:design:23.1.0'
    compile files('library/httpclient-4.0.jar')
    compile files('library/httpcore-4.0.1.jar')
    compile files('library/gdata-spreadsheet-3.0.jar')
    compile files('library/gdata-core-1.0.jar')
}

checkstyle {
    toolVersion = '8.18' // Use a reasonably modern version compatible with Java 7/Gradle 1.3
    configFile = file("${project.rootDir}/config/checkstyle/checkstyle.xml")
    sourceSets = [sourceSets.main]
}

pmd {
    toolVersion = '5.5.1' // Choose a version compatible with Java 7 and Gradle 1.3
    ruleSetFiles = files("${project.rootDir}/config/pmd/ruleset.xml")
    sourceSets = [sourceSets.main]
    ignoreFailures = true // Start with ignoreFailures=true to avoid breaking build initially
    consoleOutput = true
    reports {
        xml.enabled = false // Disable XML report for now
        html.enabled = true // Enable HTML report for easier viewing
    }
}

// Make the check task depend on checkstyle and pmd
project(':app').tasks.getByName('check') {
    dependsOn 'checkstyle', 'pmd'
}
